name: Release

# Builds a .deb for a version tag and attaches it to a DRAFT release.
# A maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ libgsl-dev libxml2-dev \
            libsamplerate0-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            pyqt6-dev-tools xsltproc docbook-xsl
      - name: Package version
        # v3.0.0-rc1 becomes 3.0.0~rc1 so that the final 3.0.0 sorts after it.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "DEB_VERSION=${v/-/\~}" >> "$GITHUB_ENV"
      - name: Build .deb
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            ${DEB_VERSION:+-DCPACK_PACKAGE_VERSION=$DEB_VERSION}
          cmake --build build
          (cd build && cpack -G DEB)
      - run: (cd build && sha256sum *.deb > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/*.deb
            build/SHA256SUMS
