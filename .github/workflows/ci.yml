name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    # Branches in this repository are covered by the push run; build PRs from forks only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ libgsl-dev libxml2-dev \
            libsamplerate0-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            pyqt6-dev-tools xsltproc docbook-xsl ffmpeg

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja gsl libxml2 libsamplerate ffmpeg pyqt docbook-xsl
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libxml2)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - name: Test LED extraction on a synthetic video
        run: |
          cd "$RUNNER_TEMP"
          ffmpeg -loglevel error -y -f lavfi -i color=black:s=320x240:r=25:d=2 \
            -f lavfi -i color=white:s=8x8:r=25:d=2 \
            -filter_complex '[0][1]overlay=x=200:y=150-t*30' -c:v mpeg4 -q:v 2 test.avi
          "${{ github.workspace }}/install/bin/process_extractleds" -t 90 test.avi
          head -2 test.spots
          # 50 frames with one 8x8 spot each, plus the final marker line
          test "$(wc -l < test.spots)" -eq 51
          awk 'NR==1 { exit !($2 == 64 && $3 == 203.5) }' test.spots

      - name: Package (Ubuntu)
        if: runner.os == 'Linux'
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: ndmanager-plugins-${{ matrix.os }}
          path: |
            install/
            build/*.deb
          if-no-files-found: ignore

  nix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#ndmanager-plugins
